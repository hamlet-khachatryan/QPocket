site_name: QPocket
site_description: >-
  A framework for analysis and benchmarking of the experimentally observed
  conformational space of protein binding pockets for drug design applications.
site_url: https://denovosciences.github.io/QPocket
repo_url: https://github.com/denovosciences/QPocket
repo_name: denovosciences/QPocket

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Configuration Reference: configuration.md
  - User Guide:
      - Overview: user-guide/index.md
      - PDB Query Mode: user-guide/pdb-query.md
      - Fragment Screening Mode: user-guide/fragment-screening.md
      - Pocket Extraction: user-guide/pocket-extraction.md
      - Distance Analysis: user-guide/distance-analysis.md
      - Running on a Cluster: user-guide/hpc.md
      - Output Files: user-guide/outputs.md
  - API Reference:
      - Overview: api/index.md
      - Library Use: api/library.md
      - Pipeline API: api/pipeline.md
      - Configuration: api/config.md
      - Utilities: api/utils.md
      - Distance Logic: api/distance.md
      - Processing: api/processing.md