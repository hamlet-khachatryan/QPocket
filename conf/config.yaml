defaults:
  - _self_

mode: "pdb_query"  # "pdb_query" or "fragment_screen"

reference:
  pdb_id: null                # e.g. "6HP0"
  chain_id: "A"
  auxiliary_chain_ids: null   # e.g. ["B"] — chains forming the interface with chain_id
  pocket_definition: "Solvent"       # "Interactions" or "Solvent"
  interaction_padding: 5.0   # Padding around interacting residues (Å) — used when pocket_definition == "Interactions"

sites:                        # Every ligand-occupied binding site is discovered
  min_heavy_atoms: 6          # Smaller HETATM groups are not ligands; carbon-free groups such as ions are never sites
  link_cutoff: 4.0            # Distance (Å) under which two ligand atoms count as one ligand
  box_padding: 4.0            # Padding (Å) around a ligand when boxing its site

fragment_screen:
  input_type: "csv"           # "csv" or "paths"
  csv_path: null              # Path to CSV with 'pdb_path' column
  structure_paths: null       # List of structure file paths (alternative to CSV)
  reference_path: null        # Reference structure
  reference_index: 0          # Fallback reference selector, used only when reference_path is null

paths:
  workdir: null

pdb_query:
  sequence_identity: 1.0
  resolution_limit: 2.5
  min_length: 20              # Minimum length of the query sequence
  max_length: null            # Maximum length of the query sequence
  experimental_method: null
  enforce_same_uniprot: false # Fetch only structures with same UniProt ID

alignment:
  renumber_residues: null     # null = auto: on for pdb_query, off for
                              # fragment_screen (local files have no UniProt
                              # entry). true/false overrides.
  manual_uniprot_id: null     # Optional: force a specific UniProt ID (e.g., "P0DTC2")
  auxiliary_uniprot_ids: null # Optional: per-chain UniProt overrides, e.g. {B: "P00533"}
  min_auxiliary_identity: 0.70        # Minimum seq identity (fraction) to accept an auxiliary chain match
  max_auxiliary_centroid_deviation: 15.0  # Å — warn if matched auxiliary Cα centroid deviates more than this
  require_all_chains: true    # Skip structures where any auxiliary chain cannot be matched

cleaning:
  allowed_cofactors: null     # Biologically relevant molecules to retain ('|'-separated, e.g. "HEM|MG|CL")

io:
  log_format: "json"          # Eliot log format: "json" or "text"
  save_intermediate: false    # Save intermediate pocket point clouds (binding_site_initial.csv)
  compression: "gzip"         # HDF5 compression: "gzip" or "none"

features:
  # Which feature providers fill featurized.csv. Dropping a provider drops its
  # columns; a set that needs no PQR skips pdb2pqr and APBS entirely.
  enabled: ["apbs", "cp_lp", "hbond", "aromatic"]
  options: {}                     # per-provider settings, keyed by provider name

interactions:
  # Which protein-ligand interactions ProLIF reports. PiStacking is the union of
  # FaceToFace and EdgeToFace, so it is rejected rather than counted twice.
  enabled: ["Hydrophobic", "HBDonor", "HBAcceptor", "FaceToFace", "EdgeToFace",
            "Cationic", "Anionic", "CationPi", "PiCation",
            "XBDonor", "XBAcceptor", "MetalDonor", "MetalAcceptor"]
  parameters: {}                  # geometry overrides, keyed by interaction name

charges:
  # Which charge model gives the electrostatic features their atoms and charges.
  use: "pdb2pqr"
  options: {}                     # per-model settings, keyed by model name

contacts:
  # Which detectors read protein-ligand contacts; prolif uses `interactions` above.
  use: ["prolif"]
  options: {}                     # per-detector settings, keyed by detector name

compute:
  # Local parallelism. Every per-structure step (align, clean, identify,
  # featurise, geodesic, fingerprint) runs on this many workers; collect and the
  # distance matrices stay serial.
  workers: 0                      # 0 = half the cores, -1 = all, N = exactly N
  backend: "process"              # "process" (separate interpreters) or "thread"

distance:
  # --- pocket fingerprint ---------------------------------------------------
  geo_graph_neighbor_radius: 2.0  # geodesic graph neighbourhood (Angstroms)
  global_k: 100                   # length of the spectral fingerprint vector
  sigma: 10.0                     # width of the heat-kernel on the graph
  max_points: 5000                # pockets with more points than this are skipped
  parallel_jobs: -1               # joblib workers (-1 = all cores)

  # --- blending the two distances -------------------------------------------
  # combined = shape_weight * d_shape + (1 - shape_weight) * chem_scale * d_chem
  #
  # With clustering.mode "two_stage" the blend groups NOTHING: each stage
  # clusters its own matrix. The blend only decides which member of a cluster
  # is named its representative.
  shape_weight: 0.85              # [0, 1]
  chem_scale: 12.5                # > 0

  clustering:
    # "two_stage" groups on pocket shape, then subdivides each group on
    # physicochemistry. "single" clusters the blended matrix in one pass, which
    # is what the pipeline did before 0.2 and reproduces those runs exactly.
    mode: "two_stage"             # "two_stage", "single" or "shape_only"
    min_cluster_size: 4           # stage-one clusters smaller than this are
                                  # not subdivided

    shape:                        # stage one: Laplacian eigenvalue distances
      method: "hierarchical"      # "hierarchical", "kmedoids" or "affinity"
      linkage: "average"          # average | complete | single | weighted
      k: null                     # null = choose by silhouette over k_range
      k_range: [2, 10]            # inclusive [lo, hi], lo >= 2
      criterion: "count"          # "count" (k / silhouette) or "threshold"
      threshold: null             # cut height when criterion is "threshold"

    chem:                         # stage two: Graph-Fourier feature distances,
      method: "kmedoids"          # applied within each shape cluster only.
      k: null                     # linkage omitted: kmedoids ignores it
      k_range: [2, 6]
      criterion: "count"          # "threshold" needs method "hierarchical"
      threshold: null

    single:                       # used only when mode == "single"
      method: "affinity"
      damping: 0.9                # affinity propagation only, [0.5, 1.0)
      max_iter: 300               # affinity propagation only

slurm:
  # Cluster submission for `qpocket slurm generate`. APBS dominates the runtime
  # (216s of a 366s 21-structure run), so featurisation runs one task per
  # structure. Nothing here is read unless you use the slurm commands.
  account: null                 # --account; null omits the directive
  partition: "compute"          # --partition
  qos: null                     # --qos; null omits the directive
  max_concurrent: 20            # simultaneously running array tasks (the %N)
  max_array_size: 1000          # cluster MaxArraySize; larger stages are split
  dependency: "afterany"        # "afterany" survives one bad structure;
                                # "afterok" blocks the chain if any task fails
  split_apbs_stage: false       # give APBS its own array stage and cache the grid

  environment: []
  # environment:
  #   - "module load gcc/11.2"
  #   - "source ~/miniconda3/etc/profile.d/conda.sh"
  #   - "conda activate QPocket"
  # or, for a plain virtualenv:
  #   - "source /path/to/.venv/bin/activate"

  defaults:                     # used by any stage without an override below
    cpus: 1
    mem: "4G"
    time: "01:00:00"

  stages:                       # per-stage overrides; keys: prepare, apbs,
    featurize:                  # featurize, collect, geodesic, distance
      cpus: 1
      mem: "8G"
      time: "04:00:00"          # APBS runs here unless split_apbs_stage is true
    geodesic:
      cpus: 1
      mem: "8G"
      time: "02:00:00"
    distance:
      cpus: 16                  # joblib parallelism, not an array
      mem: "32G"
      time: "06:00:00"
