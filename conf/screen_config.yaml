run_mode: "cross_docking"

chembl:
  url: "PLACEHOLDER_GOOGLE_DRIVE_URL"
  local_dir: "~/.qpocket/chembl_data"

decoy:
  strategy: "lude"          # DECOYS plug-in
  n_decoys_per_active: 50
  max_similarity: 0.2
  mw_diff: 20.0
  logp_diff: 0.5
  rb_diff: 1
  hba_diff: 1
  hbd_diff: 1
  charge_diff: 0

box:
  mode: "ligand_based"
  padding: 5.0

preparation:
  ph: 7.4
  num_conformers: 50
  max_iters: 500

docking:
  engine: "quickvina"      # DOCKING plug-in
  engine_path: null         # default: the engine's own executable
  exhaustiveness: 8
  num_modes: 10
  energy_range: 3.0
  cpus: 4
  seed: 42
  custom_engines: {}        # any binary, e.g.
  #  smina:
  #    executable: /opt/smina/smina
  #    output: sdf           # or pdbqt (Vina-style models)
  #    command: "{exe} -r {receptor} -l {ligand} -o {output} --center_x {center_x} --center_y {center_y} --center_z {center_z} --size_x {size_x} --size_y {size_y} --size_z {size_z} --exhaustiveness {exhaustiveness} --num_modes {num_modes} --cpu {cpus}"

slurm:
  enabled: false
  partition: "standard"
  cpus_per_task: 8
  mem: "4G"
  time: "02:00:00"
  max_concurrent: 100

analysis:
  rmsd_threshold: 2.0      # pose success: RMSD to the crystal pose below this (A)
  top_k: 3                 # also count a success when any of the top k poses passes
  bedroc_alpha: 20.0
  ef_fractions: [0.001, 0.01, 0.03, 0.05, 0.1]

receptor:
  repair: true            # PDBFixer: missing side-chain atoms, loops near the pocket
  loop_radius: 10.0       # build a missing loop only within this distance (A) of the pocket
  use: "pdb2pqr"          # RECEPTORS plug-in: protonation and partial charges
  options:
    pdb2pqr: {ph: 7.4, forcefield: "AMBER"}

crossdock:
  box_mode: "representative_pockets"   # or "interacting_residues"
  box_padding: 5.0
