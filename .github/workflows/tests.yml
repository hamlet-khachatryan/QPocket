name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked)
        run: uv sync --locked --extra viz
      - name: Lint
        # Real breakage only: undefined names, redefinitions, unused imports.
        # The full ruff config still reports pre-existing style findings.
        run: uv run ruff check --select F401,F811,F821 src/qpocket tests
      - name: Tests
        run: uv run pytest -q -m "not golden"
      - name: Doctor
        # The Windows runner has no APBS, so doctor reports it missing there.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: uv run qpocket doctor --no-smoke
      - name: Build
        run: uv build
