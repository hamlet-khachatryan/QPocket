name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked)
        run: uv sync --locked --extra viz
      - name: Tests
        run: uv run pytest -q -m "not golden"
      - name: Doctor
        run: uv run qpocket doctor --no-smoke
      - name: Build
        run: uv build
