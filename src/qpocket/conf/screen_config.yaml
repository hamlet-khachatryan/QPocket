run_mode: "cross_docking"

chembl:
  url: "PLACEHOLDER_GOOGLE_DRIVE_URL"
  local_dir: "~/.qpocket/chembl_data"

decoy:
  n_decoys_per_active: 50
  max_similarity: 0.2
  mw_diff: 20.0
  logp_diff: 0.5
  rb_diff: 1
  hba_diff: 1
  hbd_diff: 1
  charge_diff: 0

box:
  mode: "ligand_based"
  padding: 5.0

preparation:
  ph: 7.4
  num_conformers: 50
  max_iters: 500

docking:
  engine: "vina"
  engine_path: "vina"
  exhaustiveness: 8
  num_modes: 10
  energy_range: 3.0
  cpus: 4

slurm:
  enabled: false
  partition: "standard"
  cpus_per_task: 8
  mem: "4G"
  time: "02:00:00"
  max_concurrent: 100

analysis:
  rmsd_threshold: 2.0
  bedroc_alpha: 20.0
  ef_fractions: [0.001, 0.01, 0.03, 0.05, 0.1]
